# Fly.io configuration for the crosswalk review app.
# Uses the same Docker image as the main LITEFile app, but exposes only the
# crosswalk reviewer and stores its SQLite database on a persistent volume.

app = "litefile-crosswalk-review"
primary_region = "iad"

[build]

[env]
  CROSSWALK_REVIEW_DATABASE_PATH = "/data/crosswalk-review.sqlite3"
  CROSSWALK_REVIEW_HOSTNAME = "litefile-crosswalk-review.fly.dev"
  DJANGO_SETTINGS_MODULE = "efile.settings_crosswalk_review"
  LITEFILE_BASE_URL = "https://litefile-staging.fly.dev"

[deploy]
  # A volume can only attach to one Machine, so replace the old Machine before
  # starting the new release instead of attempting a second rolling Machine.
  strategy = "immediate"

[processes]
  # Release-command Machines cannot mount this app's volume. The startup script
  # migrates the database and reloads source data only when its checksum changes.
  app = "sh scripts/start-crosswalk-review.sh"

[[mounts]]
  source = "crosswalk_review_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
