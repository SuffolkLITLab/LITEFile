<!DOCTYPE html>
<html>
<head>
    <title>Test Eviction Case Type</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input { padding: 5px; width: 200px; }
        .dynamic-section { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Test Eviction Case Type Dynamic Forms</h1>
    
    <div class="form-group">
        <label for="case_type">Case Type:</label>
        <select id="case_type">
            <option value="">Select a case type...</option>
            <option value="78346">Name Change Petition (78346)</option>
            <option value="12345">Eviction Proceedings (12345)</option>
            <option value="67890">Property Repossession (67890)</option>
            <option value="99999">Property Restoration (99999)</option>
        </select>
    </div>
    
    <div id="dynamic-sections-container">
        <!-- Dynamic sections will be rendered here -->
    </div>
    
    <div id="debug-info">
        <h3>Debug Information:</h3>
        <div id="debug-output"></div>
    </div>

    <script>
        // Mock configuration that matches our YAML structure
        const mockConfig = {
            case_types: {
                name_change: {
                    keywords: ['name change', 'name petition'],
                    sections: {
                        parties: {
                            title: 'Required Parties',
                            fields: [
                                {
                                    name: 'petitioner_first_name',
                                    label: 'Petitioner First Name',
                                    type: 'text',
                                    required: true
                                }
                            ]
                        }
                    }
                }
            },
            base_case_types: {
                eviction_repossession: {
                    keywords: ['eviction', 'repossession', 'restoration'],
                    sections: {
                        case_information: {
                            title: 'Case Information',
                            fields: [
                                {
                                    name: 'case_number',
                                    type: 'text',
                                    label: 'Case Number',
                                    required: true,
                                    placeholder: 'Enter the case number'
                                }
                            ]
                        }
                    },
                    description: 'Eviction and Property Repossession Cases'
                }
            }
        };

        // Simplified version of the findCaseTypeConfig function from our JavaScript
        function findCaseTypeConfig(caseTypeText) {
            const lowerCaseText = caseTypeText.toLowerCase();
            
            // Search both case_types and base_case_types sections
            const caseTypeSources = [
                mockConfig.case_types || {},
                mockConfig.base_case_types || {}
            ];
            
            console.log('Looking for case type:', caseTypeText, 'lowercase:', lowerCaseText);
            
            for (const caseTypes of caseTypeSources) {
                console.log('Searching in case types:', Object.keys(caseTypes));
                for (const [configKey, caseConfig] of Object.entries(caseTypes)) {
                    const keywords = caseConfig.keywords || [];
                    console.log(`Checking config key: ${configKey}, keywords:`, keywords);
                    
                    // Check if any keyword matches the case type text
                    const matchingKeyword = keywords.find(keyword => {
                        const lowerKeyword = keyword.toLowerCase();
                        const matches = lowerCaseText.includes(lowerKeyword);
                        console.log(`  Keyword "${lowerKeyword}" matches "${lowerCaseText}":`, matches);
                        return matches;
                    });
                    
                    if (matchingKeyword) {
                        console.log('Found matching config:', configKey, caseConfig);
                        return caseConfig;
                    }
                }
            }
            
            console.log('No matching configuration found');
            return null;
        }

        // Render dynamic form sections
        function renderDynamicSections(caseConfig) {
            const container = document.getElementById('dynamic-sections-container');
            container.innerHTML = '';
            
            if (!caseConfig || !caseConfig.sections) {
                return;
            }
            
            for (const [sectionKey, section] of Object.entries(caseConfig.sections)) {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'dynamic-section';
                sectionDiv.innerHTML = `
                    <h3>${section.title || sectionKey}</h3>
                    ${section.fields.map(field => `
                        <div class="form-group">
                            <label for="${field.name}">${field.label}${field.required ? ' *' : ''}:</label>
                            <input type="${field.type}" id="${field.name}" name="${field.name}" 
                                   placeholder="${field.placeholder || ''}" 
                                   ${field.required ? 'required' : ''} />
                        </div>
                    `).join('')}
                `;
                container.appendChild(sectionDiv);
            }
        }

        // Handle case type selection
        document.getElementById('case_type').addEventListener('change', function(e) {
            const selectedOption = e.target.options[e.target.selectedIndex];
            const caseTypeText = selectedOption.text;
            const caseTypeValue = selectedOption.value;
            
            const debugOutput = document.getElementById('debug-output');
            debugOutput.innerHTML = `
                <strong>Selected:</strong> ${caseTypeText} (value: ${caseTypeValue})<br>
            `;
            
            if (!caseTypeValue) {
                document.getElementById('dynamic-sections-container').innerHTML = '';
                return;
            }
            
            // Find and render the configuration
            const caseConfig = findCaseTypeConfig(caseTypeText);
            
            debugOutput.innerHTML += `
                <strong>Found config:</strong> ${caseConfig ? 'Yes' : 'No'}<br>
            `;
            
            if (caseConfig) {
                debugOutput.innerHTML += `
                    <strong>Config details:</strong><br>
                    - Keywords: ${JSON.stringify(caseConfig.keywords)}<br>
                    - Sections: ${Object.keys(caseConfig.sections || {}).join(', ')}<br>
                `;
                renderDynamicSections(caseConfig);
            } else {
                document.getElementById('dynamic-sections-container').innerHTML = '<p>No dynamic configuration found for this case type.</p>';
            }
        });
    </script>
</body>
</html>
