<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Dynamic Forms</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .console { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Debug Dynamic Forms</h1>
    
    <div>
        <h2>Test Configuration Loading</h2>
        <button onclick="testConfigurationLoad()">Test Load Configuration</button>
        <div id="configResult" class="console"></div>
    </div>
    
    <div>
        <h2>Test Case Type Matching</h2>
        <input type="text" id="testCaseType" placeholder="Enter case type text" value="Name change">
        <button onclick="testCaseTypeMatching()">Test Matching</button>
        <div id="matchResult" class="console"></div>
    </div>
    
    <div>
        <h2>Simulate Form Selection</h2>
        <select id="mockCaseType">
            <option value="">Select...</option>
            <option value="name_change_01">Name change</option>
            <option value="divorce_01">Divorce</option>
            <option value="small_claims_01">Small claims</option>
        </select>
        <button onclick="simulateSelection()">Simulate Selection</button>
        <div id="simulationResult" class="console"></div>
    </div>
    
    <script>
        let mockConfig = null;
        
        async function testConfigurationLoad() {
            const resultDiv = document.getElementById('configResult');
            resultDiv.innerHTML = 'Loading configuration...';
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/case-type-config/');
                const result = await response.json();
                
                if (result.success) {
                    mockConfig = result.config;
                    resultDiv.innerHTML = `
                        <div class="success">✅ Configuration loaded successfully</div>
                        <div>Available case types: ${Object.keys(result.config.case_types).join(', ')}</div>
                        <div>Raw response preview:</div>
                        <pre>${JSON.stringify(result, null, 2).substring(0, 500)}...</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Failed to load configuration: ${result.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Error loading configuration: ${error.message}</div>`;
            }
        }
        
        function testCaseTypeMatching() {
            const testText = document.getElementById('testCaseType').value;
            const resultDiv = document.getElementById('matchResult');
            
            if (!mockConfig) {
                resultDiv.innerHTML = '<div class="error">❌ Please load configuration first</div>';
                return;
            }
            
            resultDiv.innerHTML = `Testing match for: "${testText}"<br>`;
            
            const lowerCaseText = testText.toLowerCase();
            let matchFound = false;
            
            for (const [configKey, caseConfig] of Object.entries(mockConfig.case_types)) {
                const keywords = caseConfig.keywords || [];
                resultDiv.innerHTML += `<br>Checking config "${configKey}":`;
                resultDiv.innerHTML += `<br>- Keywords: ${JSON.stringify(keywords)}`;
                
                const matchingKeyword = keywords.find(keyword => {
                    const lowerKeyword = keyword.toLowerCase();
                    const matches = lowerCaseText.includes(lowerKeyword);
                    resultDiv.innerHTML += `<br>- "${lowerKeyword}" in "${lowerCaseText}": ${matches}`;
                    return matches;
                });
                
                if (matchingKeyword) {
                    resultDiv.innerHTML += `<br><div class="success">✅ MATCH FOUND with keyword "${matchingKeyword}"</div>`;
                    matchFound = true;
                    break;
                }
            }
            
            if (!matchFound) {
                resultDiv.innerHTML += `<br><div class="error">❌ No matching configuration found</div>`;
            }
        }
        
        function simulateSelection() {
            const select = document.getElementById('mockCaseType');
            const resultDiv = document.getElementById('simulationResult');
            
            const selectedText = select.options[select.selectedIndex].text;
            const selectedValue = select.value;
            
            resultDiv.innerHTML = `
                <div>Simulating selection:</div>
                <div>- Selected text: "${selectedText}"</div>
                <div>- Selected value: "${selectedValue}"</div>
            `;
            
            if (selectedValue && mockConfig) {
                testCaseTypeMatching();
            }
        }
        
        // Auto-load configuration on page load
        window.addEventListener('load', testConfigurationLoad);
    </script>
</body>
</html>
