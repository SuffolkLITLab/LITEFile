{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ config.jurisdiction.name }}</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/options.css' %}" />
  </head>
  <body>
    {% include 'efile/components/profile_header.html' %}

    <div class="container">
      <h2 class="section-title">eFiling Options</h2>
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
          
          <div id="existing-placeholder"></div>

          <div class="option-card">
            <div class="d-flex align-items-center mb-3">
              <div class="option-icon">
                <i class="fas fa-university"></i>
              </div>
              <div class="option-content">
                <h3>Make a Filing</h3>
                <p>Begin a new case or file a response.</p>
              </div>
            </div>
            <div class="button-group">
              <!-- button class="btn btn-outline-primary" tabindex="0" onclick="goToSimpleForm('new')">
                 Simple Form
              </button-->
              <button class="btn btn-primary" tabindex="0" onclick="goToExpertForm('new')">
                Begin
              </button>
            </div>
          </div>


        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
      // Function to save existing_case data and redirect to expert form or case details
      function goToExpertForm(new_or_existing) {
        if (new_or_existing === "new") {
          // Save the existing_case selection
          makeNewCaseData().then(() => {
            // For new cases, go directly to expert form with cache clearing and options page flag
            window.location.href = `/{{jurisdiction}}/upload_first/?clear_cache=true&from_options=true`;
          });
        } else {
          // TODO(brycew): go straight to the page where the existing session was, reload everything
        }
      }

      async function checkExistingCaseData() {
        // Check if there's an API endpoint to retrieve saved case data
        const response = await fetch("/api/get-case-data/", {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
          },
        });
        if (response.ok) {
          const result = await response.json();
          if (
            result.success &&
            result.data &&
            Object.keys(result.data).length > 0
          ) {
            console.log("existing: %o", result.data)
            //TODO(brycew): return more here to bring user directly to old session
            return true;
          }
          else {
            console.log("existing: %o", result.data)
          }
        } else {
          console.log("response: %o", response)
        }
        return false;
      }

      // Function to save existing_case data to the session
      async function makeNewCaseData() {
        // Save to session storage as immediate fallback
        let new_uuid = self.crypto.randomUUID();
        sessionStorage.setItem('session_id', new_uuid);
        try {
          
          // Also make an API call to save server-side if needed
          const response = await fetch('/api/save-case-data/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': getCsrfToken(),
            },
            body: JSON.stringify({
              session_id: new_uuid,
              jurisdiction: `{{jurisdiction}}`,
            })
          });
          
          if (!response.ok) {
            console.warn('Failed to save case data server-side, session storage used only');
          } else {
            console.log("Saved data!")
          }
        } catch (error) {
          console.warn('Error saving case data:', error);
          // Session storage fallback is already in place
        }
      }

      // Helper function to get CSRF token
      function getCsrfToken() {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
          const [name, value] = cookie.trim().split('=');
          if (name === 'csrftoken') {
            return value;
          }
        }
        return '';
      }

      function useExistingCardHtml() {
        let html = `
          <div class="option-card">
            <div class="d-flex align-items-center mb-3">
              <div class="option-icon">
                <i class="fas fa-reply"></i>
              </div>
              <div class="option-content">
                <h3>Resume Filing</h3>
                <p>Resome your filing where you left off.</p>
              </div>
            </div>
            <div class="button-group">
              <button class="btn btn-primary" tabindex="0" onclick="goToExpertForm('resume')">
                Resume 
              </button>
            </div>
          </div>
          `;
          return html;
      }


      // Add keyboard navigation
      document.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          const focusedElement = document.activeElement;
          if (focusedElement.classList.contains("btn")) {
            focusedElement.click();
          }
        }
      });

      checkExistingCaseData().then(value => {
        if (value) {
          let html = useExistingCardHtml();
          let elem = document.getElementById('existing-placeholder');
          elem.innerHTML = html;
          console.log("existing session?: %o", value);
        } else {
          console.log("No existing session?, %o", value);
        }
      });
    </script>
  </body>
</html>
