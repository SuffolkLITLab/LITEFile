{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="en">
    {% translate "Choose your state" as the_title %}
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ the_title }}</title>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
              rel="stylesheet" />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
              rel="stylesheet" />
        <link rel="stylesheet" href="{% static 'css/common.css' %}" />
        <link rel="stylesheet" href="{% static 'css/options.css' %}" />
        <link rel="stylesheet" href="{% static 'css/header.css' %}" />
    </head>
    <body>
        <div class="header">
            <div class="container">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <i class="fa fa-landmark-dome scales-icon"></i>
                        <span class="brand-title">LITEfile</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="container">
            <h1>{{ the_title }}</h1>
            <div style="display:flex;
                        justify-content:space-evenly;
                        align-content:space-between;
                        flex-wrap:wrap;
                        align-items:center">
                {% for value in jurisdiction_details %}
                    <div class="option-card" style="position:relative">
                        <a href="{% url 'efile_login' jurisdiction=value.jurisdiction.code %}"
                           style="position:absolute;
                                  width:100%;
                                  height:100%;
                                  top: 0px;
                                  left: 0px"></a>
                        <div class="d-flex align-items-center mb-3">
                            <div class="option-icon">
                                <img src="{% static value.jurisdiction.svg %}"
                                     style="max-height:150%"
                                     alt="{% static value.jurisdiction.display_name %}">
                            </div>
                            <div class="option-content">
                                <h3>{{ value.jurisdiction.display_name }}</h3>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
        <script src="{% url 'javascript-catalog' %}"></script>
    </body>
</html>
