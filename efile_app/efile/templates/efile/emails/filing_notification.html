<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Your filing update</title>
    </head>
    <body style="margin:0;
                 padding:16px;
                 background-color:#f3f5f8;
                 color:#172033;
                 font-family:Arial,Helvetica,sans-serif">
        <table role="presentation"
               width="100%"
               cellspacing="0"
               cellpadding="0"
               border="0">
            <tr>
                <td align="center">
                    <table role="presentation"
                           width="100%"
                           cellspacing="0"
                           cellpadding="0"
                           border="0"
                           style="max-width:600px;
                                  background-color:#ffffff;
                                  border:1px solid #d3dbe5">
                        <tr>
                            <td style="padding:24px 16px;">
                                <h1 style="margin:0 0 24px;font-size:24px;line-height:1.3;">Your filing update</h1>
                                {{ progress }}
                                <p style="margin:24px 0 0;
                                          font-size:16px;
                                          line-height:1.6;
                                          overflow-wrap:anywhere">{{ body }}</p>
                                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#526176;">This email shows an update for a filing in your submission. Open the tracker for the latest status of each filing.</p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
