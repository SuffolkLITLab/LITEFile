# Base Case Type Configuration
# This file defines the common structure that can be inherited by state-specific configs

# Global defaults that apply to all states unless overridden
jurisdiction:
  name: "LITEFile"
  code: ""
  display_name: "LITEFile"
  brand_name: "LITEFile"
  logo: "img/litefile-logo.svg"
  logo_alt: "LITEFile logo"
  icon: "fas fa-scale-balanced"
  official_court_name: "the jurisdiction's court"
  official_tool_statement: "LITEFile is an official, approved electronic filing tool of the jurisdiction's court."
  court_logos: []
  partner_logos: []
  funder_logos:
    - name: "Legal Services Corporation"
      src: "img/logo-lsc.svg"
      alt: "Legal Services Corporation logo"
      url: "https://www.lsc.gov/"
    - name: "State Justice Institute"
      src: "img/logo-sji.png"
      alt: "State Justice Institute logo"
      url: "https://www.sji.gov/"
  help_url: ""
  help_number: ""
  contact_email: "litlab@suffolk.edu"
  contact_address: "Suffolk University Law School LIT Lab, 120 Tremont Street, Boston, MA"

defaults:
  # Other-party addresses are optional unless a state/case/court layer, a
  # selected filing/service code, or live Tyler metadata says otherwise.
  party_address:
    required: false
    required_for_party_types: []
    required_for_filing_types: []
    required_for_services: []
    reason: "The court requires a mailing address for this party before the filing can continue."
  sections:
    parties:
      title: "Required parties"
      show if:
        var: required_party_types.length
        op: gt
        rhs: 1
      api_endpoint: "/api/dropdowns/party-types/"
      requires_params: ["court", "case_type"]
      fields:
        - section_title: "The other side"
          required: true
          conditional_requirements: {}
            # Default: show for all courts except those explicitly hidden
          fields:
            - name: "other_party_type"
              label: "Party Type"
              type: "party_type_dropdown"
              required: true
              column_width: "col-12"
              api_endpoint: "/api/dropdowns/party-types/"
            - name: "other_first_name"
              label: "First Name"
              type: "text"
              required: true
              column_width: "col-6"
            - name: "other_last_name"
              label: "Last Name"
              type: "text"
              required: true
              column_width: "col-6"
        - section_title: "Their physical address"
          required: false
          conditional_requirements: {}
            # Default: show for all courts except those explicitly hidden
          fields:
            - name: "other_address_line_1"
              label: "Street Address"
              type: "text"
              required: false
              column_width: "col-12"
            - name: "other_address_line_2"
              label: "Street Address 2"
              type: "text"
              required: false 
              column_width: "col-12"
            - name: "other_address_city"
              label: "City"
              type: "text"
              required: false
              column_width: "col-6"
            - name: "other_address_state"
              label: "State"
              type: "us_state"
              required: false
              column_width: "col-6"
            - name: "other_address_zip"
              label: "Zip Code"
              type: "text"
              required: false
              column_width: "col-6"
        - section_title: "Their contact information"
          required: true
          conditional_requirements: {}
            # Default: show for all courts except those explicitly hidden
          fields:
            - name: "other_email"
              label: "Email"
              type: "email"
              required: true
              column_width: "col-12"
            - name: "other_phone_number"
              label: "Phone number"
              type: "tel"
              required: true
              column_width: "col-12"


# Base case type templates that states can inherit from.
#
# Form structure only. Document checklists (`matches`, `documents`, `about`,
# `filer_roles`) are deliberately not here: which forms a case needs, and what
# the court calls them, is a question of state law and local practice, and the
# answer is rarely the same in two states. Those live in
# `states/<jurisdiction>.yaml` -- see the "Document checklists" section of
# README.md.
base_case_types:
  name_change:
    keywords: ["name change", "name petition", "change of name"]
    description: "Legal name change proceedings"
    sections:
      parties:
        title: "Required parties"
        api_endpoint: "/api/dropdowns/party-types/"
        requires_params: ["court", "case_type"]
        fields:
          - section_title: "Name sought"
            required: false
            conditional_requirements:
              # Default: hidden for all courts except those explicitly required
              required_for_courts: []
              optional_for_courts: []
              hidden_for_courts: []
            fields:
              - name: "new_name_party_type"
                label: "Party Type"
                type: "party_type_dropdown"
                required: true
                column_width: "col-12"
                api_endpoint: "/api/dropdowns/party-types/"
              - name: "new_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-6"
              - name: "new_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-6"
  divorce:
    keywords: ["divorce", "dissolution of marriage", "annulment", "dissolution"]
    description: "Legal dissolution of marriage proceedings"
    sections:
      parties:
        title: "Required parties"
        api_endpoint: "/api/dropdowns/party-types/"
        requires_params: ["court", "case_type"]
        fields:
          - section_title: "Petitioner"
            required: true
            fields:
              - name: "petitioner_party_type"
                label: "Party Type"
                type: "party_type_dropdown"
                required: true
                column_width: "col-12"
                api_endpoint: "/api/dropdowns/party-types/"
              - name: "petitioner_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-6"
              - name: "petitioner_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-6"
          - section_title: "Defendant"
            required: true
            fields:
              - name: "defendant_party_type"
                label: "Party Type"
                type: "party_type_dropdown"
                required: true
                column_width: "col-12"
                api_endpoint: "/api/dropdowns/party-types/"
              - name: "defendant_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-6"
              - name: "defendant_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-6"

