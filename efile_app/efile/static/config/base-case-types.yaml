# Base Case Type Configuration
# This file defines the common structure that can be inherited by state-specific configs

# Global defaults that apply to all states unless overridden
defaults:
  field_types:
    text:
      class: "form-control"
      validation: "required"
    textarea:
      class: "form-control"
      rows: 3
    number:
      class: "form-control"
      validation: "numeric"
    party_type_dropdown:
      class: "form-control dropdown-field"
      validation: "required"

  column_widths:
    full: "col-12"
    half: "col-6"
    third: "col-4"
    two_thirds: "col-8"

# Base case type templates that states can inherit from
base_case_types:
  name_change:
    keywords: ["name change", "name petition", "change of name"]
    description: "Legal name change proceedings"
    sections:
      parties:
        title: "Required Parties"
        api_endpoint: "/api/dropdowns/party-types/"
        requires_params: ["court", "case_type"]
        fields:
          - section_title: "Petitioner"
            required: true
            fields:
              - name: "petitioner_party_type"
                label: "Party Type"
                type: "party_type_dropdown"
                required: true
                column_width: "col-12"
                api_endpoint: "/api/dropdowns/party-types/"
              - name: "petitioner_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-6"
              - name: "petitioner_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-6"
          - section_title: "Name Sought"
            required: false
            fields:
              - name: "new_name_party_type"
                label: "Party Type"
                type: "party_type_dropdown"
                required: true
                column_width: "col-12"
                api_endpoint: "/api/dropdowns/party-types/"
              - name: "new_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-6"
              - name: "new_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-6"
