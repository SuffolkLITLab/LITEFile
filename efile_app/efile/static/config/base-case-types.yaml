# Base Case Type Configuration
# This file defines the common structure that can be inherited by state-specific configs

# Global defaults that apply to all states unless overridden
defaults:
  sections:
    parties:
      title: "Required Parties"
      show if:
        var: required_party_types.length
        op: gt
        rhs: 1
      api_endpoint: "/api/dropdowns/party-types/"
      requires_params: ["court", "case_type"]
      fields:
        - section_title: "The Other Side"
          required: true
          conditional_requirements:
            # Default: show for all courts except those explicitly hidden
          fields:
            - name: "other_party_type"
              label: "Party Type"
              type: "party_type_dropdown"
              required: true
              column_width: "col-12"
              api_endpoint: "/api/dropdowns/party-types/"
            - name: "other_first_name"
              label: "First Name"
              type: "text"
              required: true
              column_width: "col-6"
            - name: "other_last_name"
              label: "Last Name"
              type: "text"
              required: true
              column_width: "col-6"
        - section_title: "Their Physical Address"
          required: true
          conditional_requirements:
            # Default: show for all courts except those explicitly hidden
          fields:
            - name: "other_address_line_1"
              label: "Street Address"
              type: "text"
              required: true
              column_width: "col-12"
            - name: "other_address_line_2"
              label: "Street Address 2"
              type: "text"
              required: true
              column_width: "col-12"
            - name: "other_address_city"
              label: "City"
              type: "text"
              required: true
              column_width: "col-6"
            - name: "other_address_state"
              label: "State"
              type: "us_state"
              required: true
              column_width: "col-6"
            - name: "other_address_zip"
              label: "Zip Code"
              type: "text"
              required: true
              column_width: "col-6"
        - section_title: "Their Contact Information"
          required: true
          conditional_requirements:
            # Default: show for all courts except those explicitly hidden
          fields:
            - name: "other_email"
              label: "Email"
              type: "email"
              required: true
              column_width: "col-12"
            - name: "other_phone_number"
              label: "Phone number"
              type: "tel"
              required: true
              column_width: "col-12"


# Base case type templates that states can inherit from
base_case_types:
  name_change:
    keywords: ["name change", "name petition", "change of name"]
    description: "Legal name change proceedings"
    sections:
      parties:
        title: "Required Parties"
        api_endpoint: "/api/dropdowns/party-types/"
        requires_params: ["court", "case_type"]
        fields:
          - section_title: "Name Sought"
            required: false
            conditional_requirements:
              # Default: hidden for all courts except those explicitly required
              required_for_courts: []
              optional_for_courts: []
              hidden_for_courts: []
            fields:
              - name: "new_name_party_type"
                label: "Party Type"
                type: "party_type_dropdown"
                required: true
                column_width: "col-12"
                api_endpoint: "/api/dropdowns/party-types/"
              - name: "new_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-6"
              - name: "new_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-6"
  divorce:
    keywords: ["divorce", "dissolution of marriage", "annulment", "dissolution"]
    description: "Legal dissolution of marriage proceedings"
    sections:
      parties:
        title: "Required Parties"
        api_endpoint: "/api/dropdowns/party-types/"
        requires_params: ["court", "case_type"]
        fields:
          - section_title: "Petitioner"
            required: true
            fields:
              - name: "petitioner_party_type"
                label: "Party Type"
                type: "party_type_dropdown"
                required: true
                column_width: "col-12"
                api_endpoint: "/api/dropdowns/party-types/"
              - name: "petitioner_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-6"
              - name: "petitioner_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-6"
          - section_title: "Defendant"
            required: true
            fields:
              - name: "new_name_party_type"
                label: "Party Type"
                type: "party_type_dropdown"
                required: true
                column_width: "col-12"
                api_endpoint: "/api/dropdowns/party-types/"
              - name: "new_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-6"
              - name: "new_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-6"

