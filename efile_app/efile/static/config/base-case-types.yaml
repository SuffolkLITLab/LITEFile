# Base Case Type Configuration
# This file defines the common structure that can be inherited by state-specific configs

# Global defaults that apply to all states unless overridden
defaults:
  sections:
    parties:
      title: "Required parties"
      show if:
        var: required_party_types.length
        op: gt
        rhs: 1
      api_endpoint: "/api/dropdowns/party-types/"
      requires_params: ["court", "case_type"]
      fields:
        - section_title: "The other side"
          required: true
          conditional_requirements:
            # Default: show for all courts except those explicitly hidden
          fields:
            - name: "other_party_type"
              label: "Party Type"
              type: "party_type_dropdown"
              required: true
              column_width: "col-12"
              api_endpoint: "/api/dropdowns/party-types/"
            - name: "other_first_name"
              label: "First Name"
              type: "text"
              required: true
              column_width: "col-6"
            - name: "other_last_name"
              label: "Last Name"
              type: "text"
              required: true
              column_width: "col-6"
        - section_title: "Their physical address"
          required: true
          conditional_requirements:
            # Default: show for all courts except those explicitly hidden
          fields:
            - name: "other_address_line_1"
              label: "Street Address"
              type: "text"
              required: true
              column_width: "col-12"
            - name: "other_address_line_2"
              label: "Street Address 2"
              type: "text"
              required: false 
              column_width: "col-12"
            - name: "other_address_city"
              label: "City"
              type: "text"
              required: true
              column_width: "col-6"
            - name: "other_address_state"
              label: "State"
              type: "us_state"
              required: true
              column_width: "col-6"
            - name: "other_address_zip"
              label: "Zip Code"
              type: "text"
              required: true
              column_width: "col-6"
        - section_title: "Their contact information"
          required: true
          conditional_requirements:
            # Default: show for all courts except those explicitly hidden
          fields:
            - name: "other_email"
              label: "Email"
              type: "email"
              required: true
              column_width: "col-12"
            - name: "other_phone_number"
              label: "Phone number"
              type: "tel"
              required: true
              column_width: "col-12"


# Base case type templates that states can inherit from
base_case_types:
  name_change:
    keywords: ["name change", "name petition", "change of name"]
    description: "Legal name change proceedings"
    # Names the court's own e-filing lists use for this concept. Matching is on
    # names, never on Tyler's numeric codes: the codes differ per court and
    # change without notice, while the names are stable and readable. Add an
    # alias here when a court starts calling the same thing something new.
    matches:
      names:
        - "Name Change"
        - "Change of Name"
        - "Petition for Change of Name"
        - "Name Change Petition"
    # Document guidance shown to the filer. Keys are ours; requirement is one of
    # always, usually, or sometimes. This is advice, not validation -- nothing
    # here blocks a filing.
    documents:
      petition:
        label: "Request to change a name"
        requirement: always
        role: lead
      proposed_order:
        label: "Proposed order for the judge to sign"
        requirement: usually
      fee_waiver:
        label: "Request to waive court fees"
        requirement: sometimes
        description: "File this if you cannot afford the filing fee."
        # What the court calls this when it is filed, most preferred first. See
        # the "Filing types for a checklist item" section of config/README.md.
        filing_type_names:
          - "Fee Waiver Petition Filed"                  # Cook County
          - "Application for Waiver of Court Fees"
          - "Fee Waiver"
          - "Waiver"                                     # Kane
    sections:
      parties:
        title: "Required parties"
        api_endpoint: "/api/dropdowns/party-types/"
        requires_params: ["court", "case_type"]
        fields:
          - section_title: "Name sought"
            required: false
            conditional_requirements:
              # Default: hidden for all courts except those explicitly required
              required_for_courts: []
              optional_for_courts: []
              hidden_for_courts: []
            fields:
              - name: "new_name_party_type"
                label: "Party Type"
                type: "party_type_dropdown"
                required: true
                column_width: "col-12"
                api_endpoint: "/api/dropdowns/party-types/"
              - name: "new_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-6"
              - name: "new_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-6"
  divorce:
    keywords: ["divorce", "dissolution of marriage", "annulment", "dissolution"]
    description: "Legal dissolution of marriage proceedings"
    matches:
      names:
        - "Dissolution of Marriage"
        - "Petition for Dissolution of Marriage"
        - "Divorce"
    documents:
      petition:
        label: "Petition to end a marriage"
        requirement: always
        role: lead
      summons:
        label: "Summons for the other spouse"
        requirement: usually
        description: "You do not need this if the other spouse signs an appearance or a waiver."
      fee_waiver:
        label: "Request to waive court fees"
        requirement: sometimes
        description: "File this if you cannot afford the filing fee."
    sections:
      parties:
        title: "Required parties"
        api_endpoint: "/api/dropdowns/party-types/"
        requires_params: ["court", "case_type"]
        fields:
          - section_title: "Petitioner"
            required: true
            fields:
              - name: "petitioner_party_type"
                label: "Party Type"
                type: "party_type_dropdown"
                required: true
                column_width: "col-12"
                api_endpoint: "/api/dropdowns/party-types/"
              - name: "petitioner_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-6"
              - name: "petitioner_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-6"
          - section_title: "Defendant"
            required: true
            fields:
              - name: "new_name_party_type"
                label: "Party Type"
                type: "party_type_dropdown"
                required: true
                column_width: "col-12"
                api_endpoint: "/api/dropdowns/party-types/"
              - name: "new_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-6"
              - name: "new_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-6"

