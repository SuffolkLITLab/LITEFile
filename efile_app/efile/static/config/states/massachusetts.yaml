#Example YAML configuration for Massachusetts-specific case types 

# Massachusetts-specific Case Type Configuration
# This file extends the base configuration with Massachusetts-specific settings

jurisdiction:
  name: "Massachusetts eFile"
  code: "massachusetts"
  display_name: "Massachusetts"
  brand_name: "LITEFile"
  logo: "img/litefile-logo.svg"
  logo_alt: "LITEFile logo"
  icon: "fas fa-balance-scale"
  svg: "img/MA.svg"
  api_endpoint: "/api/massachusetts"
  official_court_name: "the Massachusetts Trial Court"
  official_tool_statement: "LITEFile is an official, approved electronic filing tool of the Massachusetts Trial Court."
  court_logos:
    - name: "Massachusetts Trial Court"
      src: "img/court-logo-massachusetts.png"
      alt: "Seal of the Massachusetts Trial Court"
  help_url: "https://www.mass.gov/orgs/court-service-centers"
  help_number: "711"
  contact_email: "litlab@suffolk.edu"
  contact_address: "Suffolk University Law School LIT Lab, 120 Tremont Street, Boston, MA"
  copyedit:
    landing_text: |
      Welcome to LITEFile for Massachusetts. Use this tool to prepare and submit electronic court filings to the Massachusetts Trial Court.
    post_action_text: |
      Your filing has been submitted to the Massachusetts Trial Court for processing. Check your filing status for updates. If you have questions about a specific filing, contact the court.
    filing_statuses: |
      These are filings that you have already sent to the courts, either through this website or elsewhere.

      If you have questions about why the court didn't accept a specific filing, you should contact the court.

# State metadata
state:
  code: "MA"
  name: "Massachusetts"
  jurisdiction: "massachusetts"

# Inherit from base case types and customize
inherits_from: "base-case-types.yaml"

# Massachusetts-specific overrides and extensions
case_types:
  name_change:
    # Inherit from base but add Massachusetts-specific requirements
    extends: "base_case_types.name_change"

    # Form structure only so far. Document checklists are state-specific -- what
    # Massachusetts requires, and what its courts call each form, is not what
    # Illinois requires -- so add `matches` and `documents` here to turn one on.
    # See the "Document checklists" section of ../README.md.

    # Override with Massachusetts terminology
    sections:
      parties:
        title: "Parties to the petition"  # Massachusetts uses "petition" terminology
        sections:
          - section_title: "Petitioner"
            # Massachusetts uses different party type codes
            party_type_filter: ["MA_5628"]  # Massachusetts petitioner code
            
          - section_title: "Requested name"  # Different terminology
            required: true  # Always required in Massachusetts
            party_type_filter: ["MA_56354"]  # Massachusetts name sought code
            fields:
              - name: "new_name_party_type"
                label: "Party Classification"  # Massachusetts terminology
                type: "party_type_dropdown"
                required: true
                column_width: "col-12"
                api_endpoint: "/api/dropdowns/party-types/"
              - name: "new_first_name"
                label: "Requested First Name"
                type: "text"
                required: true
                column_width: "col-6"
              - name: "new_last_name"
                label: "Requested Last Name"
                type: "text"
                required: true
                column_width: "col-6"
              # Massachusetts requires middle name
              - name: "new_middle_name"
                label: "Requested Middle Name"
                type: "text"
                required: false
                column_width: "col-6"
    
    # Massachusetts-specific additional sections
    additional_sections:
      background_check:
        title: "Criminal background information"
        required: true
        fields:
          - name: "criminal_background_check"
            label: "Have you ever been convicted of a felony?"
            type: "radio"
            required: true
            column_width: "col-12"
            options:
              - value: "yes"
                label: "Yes"
              - value: "no"
                label: "No"
          - name: "felony_details"
            label: "If yes, please provide details"
            type: "textarea"
            required: false
            column_width: "col-12"
            conditional_display:
              show_when_field: "criminal_background_check"
              show_when_value: "yes"

# Massachusetts court-specific requirements
court_specific_requirements:
  "suffolk:probate":
    case_types:
      name_change:
        field_modifications:
          - field_group: "Requested name"
            modifications:
              conditional_requirements:
                required_for_courts: ["suffolk:probate"]

# Massachusetts-specific terminology overrides
terminology:
  case_title: "Complaint"
  petitioner: "Plaintiff"
  case_number: "Docket Number"
  filing_fee: "Entry Fee"

# How a filer says which court this filing goes to.
#
# Massachusetts does not route by county, and asking a filer for one produces a
# confident wrong answer: the District Court that serves Somerville is not in
# the county its Probate and Family Court is, and which Boston Municipal Court
# division serves an address is a question about a specific building. So the
# Trial Court asks for a department and then for a place the filer knows, and
# MACourts turns that place into the courts that serve it. The list is always
# there as well -- the lookup is an alternative, never a requirement.
court_selector:
  title: "Choose the Massachusetts court for this filing"
  # The e-filing service names courts so that they sort -- department first,
  # then county, then place -- which is not what anyone calls them. A filer
  # holding paperwork is looking for "Boston Juvenile Court", so that is what
  # the list says. The first rule that matches wins.
  court_names:
    - match: '^Juvenile Court -+ (?P<county>.+?) -+ (?P<place>.+)$'
      name: "{place} Juvenile Court - {county}"
    - match: '^District Court -+ (?P<place>.+)$'
      name: "{place} District Court"
    - match: '^BMC -+ (?P<place>.+)$'
      name: "{place} Division, Boston Municipal Court"
    - match: '^Superior Court -+ (?P<place>.+)$'
      name: "{place} Superior Court"
    - match: '^Housing -+ (?P<place>[^(]+?) \((?P<city>.+)\)$'
      name: "{place} Housing Court ({city})"
    - match: '^Housing -+ (?P<place>.+)$'
      name: "{place} Housing Court"
  lede: >-
    Start with the court shown on your paperwork.
  steps:
    - id: level
      type: choice
      short_label: "Court level"
      label: "What level of Massachusetts court is this filing for?"
      options:
        - value: trial
          label: "Trial Court"
          help: "District/BMC, Housing, Probate and Family, Juvenile, Superior, or Land Court."
          courts:
            exclude_name_pattern: "Appeals Court|Supreme Judicial Court"
        - value: appeals
          label: "Appeals Court"
          help: "For a filing in the Massachusetts Appeals Court."
          courts:
            name_pattern: "Appeals Court"
        - value: sjc
          label: "Supreme Judicial Court"
          help: "The highest court in Massachusetts."
          courts:
            name_pattern: "Supreme Judicial Court"

    - id: proceeding
      type: choice
      short_label: "Proceeding"
      when:
        level: [appeals]
      label: "Which Appeals Court proceeding?"
      hint: >-
        The docket number on your paperwork tells you which one: a P docket is
        a panel, a J docket is a single justice.
      options:
        - value: panel
          label: "Panel"
          help: "A regular appellate panel proceeding (P docket)."
          courts:
            name_pattern: "Panel"
        - value: single_justice
          label: "Single justice"
          help: "A single-justice proceeding (J docket)."
          courts:
            name_pattern: "Single Justice"

    - id: department
      type: select
      short_label: "Department"
      when:
        level: [trial]
      label: "Which Trial Court department?"
      placeholder: "Choose a department…"
      hint: >-
        The department is named on your paperwork. Choose District Court or
        Boston Municipal Court for either of those.
      # `court_types` are the department names MACourts matches on. `courts` is
      # how that department's locations are picked out of the e-filing service's
      # own list, by name -- the parent rows Tyler carries for a whole
      # department ("Housing Courts", "Superior Courts") are not places to file.
      options:
        - value: district
          label: "District Court or Boston Municipal Court"
          court_types: ["District Court", "Boston Municipal Court"]
          courts:
            name_pattern: "District Court$|Boston Municipal Court$"
        - value: housing
          label: "Housing Court"
          court_types: ["Housing Court"]
          courts:
            name_pattern: "Housing"
            exclude_name_pattern: "^Housing Courts$"
        - value: probate
          label: "Probate and Family Court"
          court_types: ["Probate and Family Court"]
          courts:
            name_pattern: "Probate and Family Court$"
        - value: juvenile
          label: "Juvenile Court"
          court_types: ["Juvenile Court"]
          courts:
            name_pattern: "Juvenile Court - .+ County$"
        - value: superior
          label: "Superior Court"
          court_types: ["Superior Court"]
          courts:
            name_pattern: "Superior Court"
            exclude_name_pattern: "^Superior Courts$"
        - value: land
          label: "Land Court"
          help: "The Land Court covers all of Massachusetts."
          court_types: ["Land Court"]
          courts:
            name_pattern: "^Land Court$"

    - id: place
      type: location
      short_label: "Place"
      when:
        level: [trial]
        department:
          not: [land]
      label: "Where is the case connected to?"
      placeholder: "Town, city, or street address"
      button_label: "Find courts"
      hint: >-
        A town, a city, or a street address -- whatever you know. For a Boston
        address, include the street.
      examples: ["Cambridge", "Somerville", "24 Beacon St, Boston", "Brockton", "Northampton"]
      matcher: macourts
      court_types_from: department
      manual_label: "Or choose your court from the list"
      no_match_hint: >-
        We could not match that place to a court. Try adding a street address,
        or choose your court from the list below.
