# Dynamic Form Configuration for Different Case Types
# This file defines the structure and fields for case-specific form sections

case_types:
  name_change:
    # Keywords that identify this case type (case-insensitive)
    keywords: ["name change"]
    
    # Sections to render for this case type
    sections:
      parties:
        title: "Required Parties"
        api_endpoint: "/api/dropdowns/party-types/"
        requires_params: ["court", "case_type"]
        fields:
          - section_title: "Petitioner"
            required: true
            party_type_filter: ["5628"]  # "Petitioner" party type code
            fields:
              - name: "petitioner_party_type"
                label: "Party Type"
                type: "party_type_dropdown"
                required: true
                column_width: "col-12"
                api_endpoint: "/api/dropdowns/party-types/"
              - name: "petitioner_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-6"
              - name: "petitioner_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-6"
          
          - section_title: "Name Sought"
            required: false  # Default to not required
            conditional_requirements:
              # Only required for cook:cd1 court specifically
              required_for_courts: ["cook:cd1"]
              # Optional/hidden for all other courts
              hidden_for_courts: ["cook:chd1", "cook:pr1", "cook:crd1", "cook:law1", "cook:cvd1", "cook:dr1"]
            party_type_filter: ["56354"]  # "Name Sought" party type code
            fields:
              - name: "new_name_party_type"
                label: "Party Type"
                type: "party_type_dropdown"
                required: true
                column_width: "col-12"
                api_endpoint: "/api/dropdowns/party-types/"
              - name: "new_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-6"
              - name: "new_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-6"

  # Example configuration for future case types
  divorce:
    keywords: ["divorce", "dissolution"]
    sections:
      parties:
        title: "Parties to the Action"
        fields:
          - section_title: "Plaintiff"
            required: true
            fields:
              - name: "plaintiff_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "plaintiff_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "plaintiff_address"
                label: "Address"
                type: "textarea"
                required: true
                column_width: "col-12"
          
          - section_title: "Defendant"
            required: true
            fields:
              - name: "defendant_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "defendant_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "defendant_address"
                label: "Address"
                type: "textarea"
                required: false
                column_width: "col-12"
  small_claims:
    keywords: ["small claims", "small claim"]
    sections:
      parties:
        title: "Parties to the Action"
        fields:
          - section_title: "Plaintiff"
            required: true
            fields:
              - name: "plaintiff_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "plaintiff_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "plaintiff_business_name"
                label: "Business Name (if applicable)"
                type: "text"
                required: false
                column_width: "col-12"
          
          - section_title: "Defendant"
            required: true
            fields:
              - name: "defendant_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "defendant_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "claim_amount"
                label: "Claim Amount"
                type: "number"
                required: true
                column_width: "col-md-6"
                min: "0"
                max: "7000"
                step: "0.01"
