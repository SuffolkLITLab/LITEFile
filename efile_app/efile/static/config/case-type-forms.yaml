# Dynamic Form Configuration for Different Case Types
# This file defines the structure and fields for case-specific form sections

case_types:
  name_change:
    # Keywords that identify this case type (case-insensitive)
    keywords: ["name change"]
    
    # Sections to render for this case type
    sections:
      parties:
        title: "Required Parties"
        fields:
          - section_title: "Petitioner"
            required: true
            fields:
              - name: "petitioner_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "petitioner_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-md-6"
          
          - section_title: "Name Sought"
            required: true
            fields:
              - name: "new_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "new_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-md-6"

  # Example configuration for future case types
  divorce:
    keywords: ["divorce", "dissolution"]
    sections:
      parties:
        title: "Parties to the Action"
        fields:
          - section_title: "Plaintiff"
            required: true
            fields:
              - name: "plaintiff_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "plaintiff_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "plaintiff_address"
                label: "Address"
                type: "textarea"
                required: true
                column_width: "col-12"
          
          - section_title: "Defendant"
            required: true
            fields:
              - name: "defendant_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "defendant_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "defendant_address"
                label: "Address"
                type: "textarea"
                required: false
                column_width: "col-12"
  small_claims:
    keywords: ["small claims", "small claim"]
    sections:
      parties:
        title: "Parties to the Action"
        fields:
          - section_title: "Plaintiff"
            required: true
            fields:
              - name: "plaintiff_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "plaintiff_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "plaintiff_business_name"
                label: "Business Name (if applicable)"
                type: "text"
                required: false
                column_width: "col-12"
          
          - section_title: "Defendant"
            required: true
            fields:
              - name: "defendant_first_name"
                label: "First Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "defendant_last_name"
                label: "Last Name"
                type: "text"
                required: true
                column_width: "col-md-6"
              - name: "claim_amount"
                label: "Claim Amount"
                type: "number"
                required: true
                column_width: "col-md-6"
                min: "0"
                max: "7000"
                step: "0.01"
