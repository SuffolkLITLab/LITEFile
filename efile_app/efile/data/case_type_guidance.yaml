# Curated guidance and discovery facets. Unknown classifications remain visible.
version: 2
jurisdictions:
- illinois
- massachusetts
- vermont
topics:
  eviction:
    label: Eviction
    pattern: \b(eviction|ejectment|forcible|unlawful detainer|summary process)\b
    query_pattern: \b(eviction|evict\w*|ejectment|unlawful detainer|summary process|landlord|tenant|forcible)\b
    text: A case about who has the right to occupy property.
    source: https://www.illinoiscourts.gov/courts/additional-resources/eviction/
    facets:
    - key: role
      label: Your role
      options:
      - value: tenant
        label: Tenant / occupant
        pattern: ^(answer|response|objection)\b|\b(for|by) (respondent|defendant)\b
        field: filing
      - value: landlord
        label: Landlord / owner
        pattern: ^(complaint|petition)(\b|/)|\b(for|by) (petitioner|plaintiff)\b
        field: filing
    - key: property
      label: Property
      options:
      - value: residential
        label: Home
        pattern: \bresidential\b
        field: case
        text: A home or apartment.
      - value: commercial
        label: Business
        pattern: \bcommercial\b
        field: case
        text: Property used for a business, such as a store or office.
    - key: relief
      label: What the landlord is asking for
      options:
      - value: possession
        label: Property back only
        pattern: \bpossession only\b
        field: case
        text: The landlord seeks the property back, not unpaid rent; court costs may still be requested.
      - value: money
        label: Money too
        pattern: \b(money|rent|damages)\b
        field: case
        text: Includes a money claim; check the complaint for what is requested.
    jurisdictions:
      illinois:
        text: An eviction case asks the court to return possession of property to a landlord or owner. Some cases
          also seek unpaid rent.
        source: https://www.illinoiscourts.gov/courts/additional-resources/eviction/
        special:
        - pattern: \bejectment\b
          text: A claim to recover property based on a legal right to possess it. It can involve ownership rights;
            it is not simply another name for a residential rental eviction.
          source: https://my.ilga.gov/legislation/ILCS/details?ActID=2017&ActName=Code+of+Civil+Procedure.&ChapAct=735+ILCS+5%2F&Chapter=CIVIL+PROCEDURE&ChapterID=56&MajorTopic=RIGHTS+AND+REMEDIES&SeqEnd=39000000&SeqStart=34500000
      massachusetts:
        text: Massachusetts calls an eviction court case “summary process.” It concerns possession of rental property
          and may also include a claim for unpaid rent.
        source: https://www.mass.gov/eviction-for-tenants
      vermont:
        text: An eviction case asks the Civil Division of the Superior Court to return possession of rented property
          to a landlord.
        source: https://www.vtcourts.gov/civil/eviction-process
    unknown_notes:
    - when: relief
      if_known: property
      text: The name does not say whether money is requested; check the complaint.
  foreclosure:
    label: Mortgage foreclosure
    pattern: \b(foreclos\w*)\b
    query_pattern: \b(foreclos\w*)\b
    text: A lender or lien holder asks the court to sell property to pay a secured debt.
    source: https://www.illinoiscourts.gov/courts/additional-resources/mortgage-foreclosure/
    facets:
    - key: role
      label: Your role
      options:
      - value: responding
        label: Property owner
        pattern: ^(answer|response|objection)\b|\b(for|by) (respondent|defendant)\b
        field: filing
      - value: requesting
        label: Lender / lien holder
        pattern: ^(complaint|petition)(\b|/)|\b(for|by) (petitioner|plaintiff)\b
        field: filing
    - key: property
      label: Property
      options:
      - value: residential
        label: Home
        pattern: \bresidential\b
        field: case
        text: A home or apartment.
      - value: commercial
        label: Business
        pattern: \bcommercial\b
        field: case
        text: Property used for a business, such as a store or office.
    - key: issue
      label: Type of claim
      options:
      - value: mortgage
        label: Mortgage loan
        pattern: \bmortgage\b
        field: case
      - value: lien
        label: Other lien
        pattern: \b(mechanic|assessment|condominium|lien)\b
        field: case
    jurisdictions: {}
  replevin:
    label: Return of personal property
    pattern: \b(replevin|detinue)\b
    query_pattern: \b(replevin|detinue)\b
    text: A request to recover belongings held by someone else; this is different from recovering land or housing.
    source: https://www.illinoislegalaid.org/legal-information/getting-my-property-back
    facets:
    - key: role
      label: Your role
      options:
      - value: responding
        label: Responding to the request
        pattern: ^(answer|response|objection)\b|\b(for|by) (respondent|defendant)\b
        field: filing
      - value: requesting
        label: Seeking property back
        pattern: ^(complaint|petition)(\b|/)|\b(for|by) (petitioner|plaintiff)\b
        field: filing
    - key: procedure
      label: Court label
      options:
      - value: replevin
        label: Replevin
        pattern: \breplevin\b
        field: case
        text: Replevin asks for return of specific belongings through a statutory court process.
      - value: detinue
        label: Detinue
        pattern: \bdetinue\b
        field: case
        text: Detinue is another court procedure for recovery of belongings or their value.
    jurisdictions: {}
  property_damage:
    label: Property damage
    pattern: \b(property damage|damage to property)\b
    query_pattern: \b(property damage|damage to property)\b
    text: A claim for harm to belongings, a vehicle, or real estate, rather than injury to a person.
    source: https://www.illinoislegalaid.org/legal-information/what-are-my-rights-when-car-accident-happens
