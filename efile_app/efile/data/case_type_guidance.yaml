  small_claims:
    label: Small claims
    pattern: \bsmall claims?\b
    query_pattern: \bsmall claims?\b
    text: A simpler court process for certain lower-value money disputes; the court sets the limit.
    source: https://www.illinoislegalaid.org/legal-information/small-claims
    facets:
    - key: role
      label: Your role
      options:
      - value: responding
        label: Responding to a claim
        pattern: ^(answer|response|objection)\b|\b(for|by) (respondent|defendant)\b
        field: filing
      - value: requesting
        label: Asking for payment
        pattern: ^(complaint|petition)(\b|/)|\b(for|by) (petitioner|plaintiff)\b
        field: filing
    - key: issue
      label: Dispute about
      options:
      - value: contract
        label: Agreement or bill
        pattern: \b(contract|debt|account|bill)\b
        field: case
      - value: damage
        label: Damaged property
        pattern: \b(property damage|damage to property)\b
        field: case
      - value: deposit
        label: Security deposit
        pattern: \bsecurity deposit\b
        field: case
    jurisdictions:
      illinois:
        usual_limit_cents: 1000000
        amount_help: Illinois small claims generally cover up to $10,000, excluding interest and costs. Amount brackets
          below come from the remaining court labels.
        source: https://www.illinoiscourts.gov/rules/supreme-court-rules/
      massachusetts:
        usual_limit_cents: 700000
        amount_help: Massachusetts generally limits small claims to $7,000; motor-vehicle property-damage claims
          can exceed that limit. Brackets below reflect the remaining court labels.
        source: https://www.mass.gov/info-details/small-claims-court
      vermont:
        usual_limit_cents: 1000000
        amount_help: Vermont generally allows up to $10,000; consumer credit and medical debt claims are capped
          at $5,000. Brackets below reflect the remaining court labels.
        source: https://www.vtcourts.gov/civil/suing-and-being-sued-small-claims
