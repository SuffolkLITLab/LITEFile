        pattern: \b(vehicle|auto\w*)\b
        field: case
      - value: real_estate
        label: Land or building
        pattern: \b(real estate|real property|building)\b
        field: case
      - value: belongings
        label: Other belongings
        pattern: \b(personal property|belongings)\b
