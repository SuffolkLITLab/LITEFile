<!DOCTYPE html>
<html>
<head>
    <title>Debug Dynamic Forms</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Debug Dynamic Form Sections</h1>
    
    <div class="debug">
        <h3>1. Test Configuration Loading</h3>
        <button onclick="testConfig()">Test Config API</button>
        <div id="configResult"></div>
    </div>
    
    <div class="debug">
        <h3>2. Test Case Type Matching</h3>
        <button onclick="testMatching()">Test "Name change" Matching</button>
        <div id="matchResult"></div>
    </div>
    
    <div class="debug">
        <h3>3. Check JavaScript Objects</h3>
        <button onclick="checkObjects()">Check Global Objects</button>
        <div id="objectsResult"></div>
    </div>
    
    <div class="debug">
        <h3>4. Mock Dynamic Form Generation</h3>
        <button onclick="mockDynamicForm()">Generate Mock Form</button>
        <div id="mockResult"></div>
    </div>
    
    <!-- Mock DOM structure like the real form -->
    <div id="dynamicSections" style="display: none; border: 2px solid blue; padding: 10px; margin: 20px 0;">
        <h3>Mock Dynamic Sections</h3>
        <div id="partiesContainer" style="border: 1px solid green; padding: 5px; margin: 5px;">
            <p>Parties Container (should show name fields)</p>
        </div>
        <div id="servicesContainer" style="border: 1px solid orange; padding: 5px; margin: 5px;">
            <p>Services Container (should show optional services)</p>
        </div>
    </div>
    
    <script>
        let mockConfig = null;
        
        async function testConfig() {
            const result = document.getElementById('configResult');
            result.innerHTML = 'Loading...';
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/case-type-config/');
                const data = await response.json();
                
                if (data.success) {
                    mockConfig = data.config;
                    result.innerHTML = `
                        <div class="success">✅ Config loaded</div>
                        <div>Case types: ${Object.keys(data.config.case_types).join(', ')}</div>
                    `;
                } else {
                    result.innerHTML = `<div class="error">❌ Config failed: ${data.error}</div>`;
                }
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        function testMatching() {
            const result = document.getElementById('matchResult');
            
            if (!mockConfig) {
                result.innerHTML = '<div class="error">❌ Load config first</div>';
                return;
            }
            
            const testText = 'Name change';
            const lowerText = testText.toLowerCase();
            
            let matchFound = false;
            let matchingConfig = null;
            
            for (const [configKey, caseConfig] of Object.entries(mockConfig.case_types)) {
                const keywords = caseConfig.keywords || [];
                
                for (const keyword of keywords) {
                    if (lowerText.includes(keyword.toLowerCase())) {
                        matchFound = true;
                        matchingConfig = caseConfig;
                        result.innerHTML = `
                            <div class="success">✅ Match found: ${configKey}</div>
                            <div>Keyword: "${keyword}"</div>
                            <div>Has parties: ${caseConfig.sections && caseConfig.sections.parties ? 'Yes' : 'No'}</div>
                            <div>Has services: ${caseConfig.sections && caseConfig.sections.services ? 'Yes' : 'No'}</div>
                        `;
                        return;
                    }
                }
            }
            
            if (!matchFound) {
                result.innerHTML = '<div class="error">❌ No match found</div>';
            }
        }
        
        function checkObjects() {
            const result = document.getElementById('objectsResult');
            
            result.innerHTML = `
                <div>window.dynamicFormSections: ${window.dynamicFormSections ? '✅ Available' : '❌ Missing'}</div>
                <div>window.DynamicFormSections: ${window.DynamicFormSections ? '✅ Available' : '❌ Missing'}</div>
                <div>document.getElementById('partiesContainer'): ${document.getElementById('partiesContainer') ? '✅ Found' : '❌ Missing'}</div>
                <div>document.getElementById('servicesContainer'): ${document.getElementById('servicesContainer') ? '✅ Found' : '❌ Missing'}</div>
                <div>document.getElementById('dynamicSections'): ${document.getElementById('dynamicSections') ? '✅ Found' : '❌ Missing'}</div>
            `;
        }
        
        function mockDynamicForm() {
            const result = document.getElementById('mockResult');
            
            if (!mockConfig || !mockConfig.case_types.name_change) {
                result.innerHTML = '<div class="error">❌ No name_change config available</div>';
                return;
            }
            
            const nameChangeConfig = mockConfig.case_types.name_change;
            const partiesSection = nameChangeConfig.sections.parties;
            
            let html = '<div class="info">Generating parties section:</div>';
            
            if (partiesSection && partiesSection.fields) {
                partiesSection.fields.forEach(partyGroup => {
                    if (partyGroup.section_title && partyGroup.fields) {
                        html += `<div><strong>${partyGroup.section_title}:</strong></div>`;
                        partyGroup.fields.forEach(field => {
                            html += `<div>- ${field.label} (${field.name})</div>`;
                        });
                    }
                });
            }
            
            result.innerHTML = html;
            
            // Try to actually render to the mock containers
            const partiesContainer = document.getElementById('partiesContainer');
            const dynamicSections = document.getElementById('dynamicSections');
            
            if (partiesContainer && partiesSection) {
                let formHtml = '<h4>Generated Form Fields:</h4>';
                
                partiesSection.fields.forEach(partyGroup => {
                    if (partyGroup.section_title) {
                        formHtml += `<div class="party-section" style="margin: 10px 0; padding: 10px; border: 1px solid #ccc;">
                            <div class="party-title" style="font-weight: bold;">${partyGroup.section_title}</div>`;
                        
                        if (partyGroup.fields) {
                            formHtml += '<div class="row" style="display: flex; flex-wrap: wrap;">';
                            
                            partyGroup.fields.forEach(field => {
                                const columnClass = field.column_width || 'col-12';
                                const requiredAttr = field.required ? 'required' : '';
                                
                                formHtml += `
                                    <div class="${columnClass}" style="flex: 1; margin: 5px;">
                                        <label style="font-weight: bold;">${field.label}</label>
                                        <input type="${field.type}" name="${field.name}" ${requiredAttr} style="width: 100%; padding: 5px; border: 1px solid #ccc;">
                                    </div>`;
                            });
                            
                            formHtml += '</div>';
                        }
                        
                        formHtml += '</div>';
                    }
                });
                
                partiesContainer.innerHTML = formHtml;
                dynamicSections.style.display = 'block';
                
                result.innerHTML += '<div class="success">✅ Mock form rendered!</div>';
            }
        }
        
        // Auto-load config
        window.addEventListener('load', testConfig);
    </script>
</body>
</html>
