# fly.toml app configuration file generated for forms-mvp-staging on 2025-08-20T14:42:16-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'forms-mvp-staging'
primary_region = 'lax'

[build]

[env]
  DJANGO_SETTINGS_MODULE = "efile.settings_staging"

[deploy]
  # Run database migrations before each release
  release_command = "uv run python manage.py migrate --noinput"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
