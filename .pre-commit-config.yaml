repos:
  # Ruff: format + lint (fast)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff-format
      - id: ruff
        args: ["--fix"]

  # Ty: Rust-based Python type checker (configured in pyproject.toml under [tool.ty])
  - repo: local
    hooks:
      # Keep the non-Python assets in sync with the formatters used by CI.
      - id: djlint-format
        name: djlint (format)
        entry: bash -c
        language: system
        files: ^efile_app/.*\.html$
        args:
          - |
            ROOT_DIR=$(git rev-parse --show-toplevel)
            files=()
            for file in "$@"; do
              files+=("$ROOT_DIR/$file")
            done
            uv run --directory "$ROOT_DIR/efile_app" djlint --reformat "${files[@]}"
          - --

      - id: djlint-lint
        name: djlint (lint)
        entry: bash -c
        language: system
        files: ^efile_app/.*\.html$
        args:
          - |
            ROOT_DIR=$(git rev-parse --show-toplevel)
            files=()
            for file in "$@"; do
              files+=("$ROOT_DIR/$file")
            done
            uv run --directory "$ROOT_DIR/efile_app" djlint "${files[@]}"
          - --

      - id: css-beautify
        name: css-beautify (format)
        entry: bash -c
        language: system
        files: ^efile_app/.*\.css$
        args:
          - |
            ROOT_DIR=$(git rev-parse --show-toplevel)
            files=()
            for file in "$@"; do
              files+=("$ROOT_DIR/$file")
            done
            uv run --directory "$ROOT_DIR/efile_app" css-beautify -r "${files[@]}"
          - --

      - id: stylelint
        name: Stylelint accessibility rules
        entry: bash -c
        language: system
        files: ^efile_app/efile/.*\.css$
        args:
          - |
            ROOT_DIR=$(git rev-parse --show-toplevel)
            cd "$ROOT_DIR/efile_app" && npm exec -- stylelint "efile/**/*.css"
          - --

      - id: js-beautify
        name: js-beautify (format)
        entry: bash -c
        language: system
        files: ^efile_app/.*\.js$
        args:
          - |
            ROOT_DIR=$(git rev-parse --show-toplevel)
            files=()
            for file in "$@"; do
              files+=("$ROOT_DIR/$file")
            done
            uv run --directory "$ROOT_DIR/efile_app" js-beautify -r "${files[@]}"
          - --

      - id: prettier
        name: Prettier (JavaScript tooling config)
        entry: bash -c
        language: system
        files: ^efile_app/eslint\.config\.mjs$
        args:
          - |
            ROOT_DIR=$(git rev-parse --show-toplevel)
            cd "$ROOT_DIR/efile_app" && npm exec -- prettier --write eslint.config.mjs
          - --

      - id: eslint
        name: ESLint (including SonarJS)
        entry: bash -c
        language: system
        files: ^efile_app/.*\.(js|mjs|cjs)$
        args:
          - |
            ROOT_DIR=$(git rev-parse --show-toplevel)
            files=()
            for file in "$@"; do
              files+=("${file#efile_app/}")
            done
            cd "$ROOT_DIR/efile_app" && npm exec -- eslint --max-warnings=0 -- "${files[@]}"
          - --

      - id: ty
        name: ty (type check)
        entry: bash -c
        language: system
        types: [python]
        pass_filenames: false
        args:
          - |
            ROOT_DIR=$(git rev-parse --show-toplevel)
            uv run --directory "$ROOT_DIR/efile_app" ty check

      - id: bandit
        name: Bandit (security scan)
        entry: bash -c
        language: system
        files: ^efile_app/.*\.py$
        pass_filenames: false
        args:
          - |
            ROOT_DIR=$(git rev-parse --show-toplevel)
            uv run --directory "$ROOT_DIR/efile_app" bandit -r efile --exclude efile/tests

      - id: makemigrations
        name: Django makemigrations (check)
        entry: bash -c
        language: system
        types: [python]
        pass_filenames: false
        args:
          - |
            ROOT_DIR=$(git rev-parse --show-toplevel)
            DJANGO_SETTINGS_MODULE=efile.settings uv run --directory "$ROOT_DIR/efile_app" python manage.py makemigrations --check --dry-run

  # Run tests on pre-push to keep commits snappy
  - repo: local
    hooks:
      - id: pytest
        name: pytest (pre-push)
        entry: bash -c
        language: system
        stages: [pre-push]
        pass_filenames: false
        args:
          - |
            ROOT_DIR=$(git rev-parse --show-toplevel)
            uv run --directory "$ROOT_DIR/efile_app" pytest -q

      - id: js-test
        name: JavaScript unit tests (pre-push)
        entry: bash -c
        language: system
        stages: [pre-push]
        pass_filenames: false
        args:
          - |
            ROOT_DIR=$(git rev-parse --show-toplevel)
            cd "$ROOT_DIR/efile_app" && npm run test:unit

          # If needed, override Django settings here instead of pyproject:
          # - --ds=efile.settings
