repos:
  # Ruff: format + lint (fast)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff-format
      - id: ruff
        args: ["--fix"]

  # Ty: Rust-based Python type checker (configured in pyproject.toml under [tool.ty])
  - repo: local
    hooks:
      # Keep the non-Python assets in sync with the formatters used by CI.
      - id: djlint-format
        name: djlint (format)
        entry: bash -c
        language: system
        files: ^efile_app/.*\.html$
        args:
          - |
            files=()
            for file in "$@"; do
              files+=("${file#efile_app/}")
            done
            (cd efile_app && uv run djlint --reformat "${files[@]}")
          - --

      - id: djlint-lint
        name: djlint (lint)
        entry: bash -c
        language: system
        files: ^efile_app/.*\.html$
        args:
          - |
            files=()
            for file in "$@"; do
              files+=("${file#efile_app/}")
            done
            (cd efile_app && uv run djlint "${files[@]}")
          - --

      - id: css-beautify
        name: css-beautify (format)
        entry: bash -c
        language: system
        files: ^efile_app/.*\.css$
        args:
          - |
            files=()
            for file in "$@"; do
              files+=("${file#efile_app/}")
            done
            (cd efile_app && uv run css-beautify -r "${files[@]}")
          - --

      - id: js-beautify
        name: js-beautify (format)
        entry: bash -c
        language: system
        files: ^efile_app/.*\.js$
        args:
          - |
            files=()
            for file in "$@"; do
              files+=("${file#efile_app/}")
            done
            (cd efile_app && uv run js-beautify -r "${files[@]}")
          - --

      - id: ty
        name: ty (type check)
        entry: bash -lc
        language: system
        types: [python]
        pass_filenames: false
        args:
          - cd efile_app && uv run ty check

  # Run tests on pre-push to keep commits snappy
  - repo: local
    hooks:
      - id: pytest
        name: pytest (pre-push)
        entry: bash -lc
        language: system
        stages: [pre-push]
        pass_filenames: false
        args:
          - cd efile_app && uv run pytest -q
          # If needed, override Django settings here instead of pyproject:
          # - --ds=efile.settings
