[project]
name = "form-submission-mvp"
version = "0.1.0"
description = "Minimal Django app for form submission and review"
requires-python = ">=3.10"
dependencies = [
    "Django==5.2.5",
    "requests>=2.31,<3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
# uv will create and manage a local .venv by default when using `uv sync`
# You can commit `uv.lock` to lock dependencies.

[dependency-groups]
# Allow `uv sync --group dev`
dev = [
  "ruff>=0.5.0,<1",
  "ty",
]

[project.optional-dependencies]
# Development-only tools
dev = [
    "ruff>=0.5.0,<1",
    "ty",
]

[tool.ruff]
# Align with project Python requirement
target-version = "py310"
line-length = 120
src = ["mysite"]
extend-exclude = [
    "**/migrations/*",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    # pycodestyle / pyflakes
    "E", "F",
    # isort imports
    "I",
    # pyupgrade
    "UP",
    # bugbear
    "B",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["mysite"]

# Ty (Rust-based Python type checker)
[tool.ty.src]
include = ["mysite"]
exclude = ["**/migrations/**"]
