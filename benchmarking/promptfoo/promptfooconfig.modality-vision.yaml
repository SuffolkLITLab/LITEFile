# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: LITEFile rendered-page side of the two-document modality sentinel

prompts:
  - id: file://./prompts/document_extraction.py:create_v1_vision
    label: document-extraction:v1-production:vision
  - id: file://./prompts/document_extraction.py:create_v2_vision
    label: document-extraction:v2-evidence-bound:vision

providers:
  - id: openai:chat:gpt-5.4-nano
    label: openai-small:gpt-5.4-nano
    config:
      reasoning_effort: low
      response_format:
        type: json_object
  - id: openai:chat:gpt-5.4
    label: openai-large:gpt-5.4
    config:
      reasoning_effort: low
      response_format:
        type: json_object
  - id: openai:chat:gpt-4o-mini
    label: openai-small:gpt-4o-mini
    config:
      temperature: 0
      response_format:
        type: json_object
  - id: openai:chat:gpt-4o
    label: openai-large:gpt-4o
    config:
      temperature: 0
      response_format:
        type: json_object
  - id: openai:chat:benchmark-llama-4-scout
    label: meta-small:llama-4-scout
  - id: openai:chat:llama-4-maverick
    label: meta-large:llama-4-maverick
  - id: openai:chat:benchmark-phi-4-multimodal
    label: microsoft-small:phi-4-multimodal

defaultTest:
  threshold: 0.6
  options:
    disableVarExpansion: true
  assert:
    - type: javascript
      value: file://./assertions/set_jaccard.js
      metric: field-set-jaccard

tests: file://./data/modality_cases.jsonl

evaluateOptions:
  maxConcurrency: 2

sharing: false
