name: CI

on:
  push:
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install dependencies (runtime + dev tools)
        run: |
          python -m pip install Django==5.2.5 'requests>=2.31,<3'
          python -m pip install ruff ty pytest pytest-django pytest-cov pytest-xdist

      - name: Ruff format (check only)
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Type check (ty)
        run: ty

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: efile.settings
        run: pytest -q
